# ============================================================
# Auto Build Zhihu++ — 独立 Builder 仓库模式（最终版）
# ============================================================
# 解决过的所有问题：
#   1. ${{ env.gh_user }} 在 workflow 解析时为空 → 改用 step outputs
#   2. GITHUB_ENV 在当前步骤不可用 → 改用 step-level env
#   3. JDK 17 keytool 默认 PKCS12 格式报 Tag over 30
#      → 改用 apksigner 外部签名，绕过 AGP 签名格式兼容问题
#   4. Node.js 20 弃用 → 加 FORCE_JAVASCRIPT_ACTIONS_TO_NODE24
# ============================================================
name: Auto Build Zhihu++

on:
  workflow_dispatch:
    inputs:
      skip_sync:
        description: 'Skip upstream sync, build from current fork state'
        required: false
        default: false
        type: boolean

  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: zhihu-plus-plus-build
  cancel-in-progress: true

permissions:
  contents: write

env:
  UPSTREAM_OWNER: zly2006
  UPSTREAM_REPO: zhihu-plus-plus
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ================================================================
  # Job 1: Fork / Sync Upstream
  # ================================================================
  sync-upstream:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.decision.outputs.should_build }}
      upstream_sha: ${{ steps.upstream-info.outputs.upstream_sha }}
      fork_repo: ${{ steps.setup.outputs.fork_repo }}

    steps:
      # --------------------------------------------------------
      # 1. 验证 FORK_TOKEN
      # --------------------------------------------------------
      - name: Verify FORK_TOKEN
        run: |
          if [ -z "${{ secrets.FORK_TOKEN }}" ]; then
            echo "::error::FORK_TOKEN secret is not set."
            echo "::error::Go to Settings → Secrets and variables → Actions"
            echo "::error::Add FORK_TOKEN with a PAT that has public_repo scope."
            exit 1
          fi
          echo "FORK_TOKEN OK"

      # --------------------------------------------------------
      # 2. 获取用户身份 + 确定 fork repo 名称
      #    GH_TOKEN 用 step env 注入（不用 GITHUB_ENV）
      # --------------------------------------------------------
      - name: Setup and determine fork repo
        id: setup
        env:
          GH_TOKEN: ${{ secrets.FORK_TOKEN }}
        run: |
          USER=$(gh api user --jq '.login')
          echo "Authenticated as: $USER"
          REPO="$USER/${{ env.UPSTREAM_REPO }}"
          echo "fork_repo=$REPO" >> $GITHUB_OUTPUT
          echo "GH_TOKEN=${{ secrets.FORK_TOKEN }}" >> $GITHUB_ENV

      # --------------------------------------------------------
      # 3. 检查 fork 是否存在
      # --------------------------------------------------------
      - name: Check fork existence
        id: check-fork
        run: |
          R="${{ steps.setup.outputs.fork_repo }}"
          C=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${{ secrets.FORK_TOKEN }}" \
            "https://api.github.com/repos/$R")
          echo "exists=$([ "$C" = "200" ] && echo true || echo false)" >> $GITHUB_OUTPUT

      # --------------------------------------------------------
      # 4. 创建 fork
      # --------------------------------------------------------
      - name: Create fork
        if: steps.check-fork.outputs.exists == 'false'
        run: |
          echo "Creating fork..."
          R=$(curl -s -X POST \
            -H "Authorization: token ${{ secrets.FORK_TOKEN }}" \
            "https://api.github.com/repos/${{ env.UPSTREAM_OWNER }}/${{ env.UPSTREAM_REPO }}/forks" -d '{}')
          echo "$R" | jq -r '.full_name // .message' && \
            [ "$(echo "$R" | jq -r '.full_name')" != "null" ] || exit 1
          sleep 20

      # --------------------------------------------------------
      # 5. 获取上游默认分支和最新 SHA
      # --------------------------------------------------------
      - name: Get upstream info
        id: upstream-info
        run: |
          U="https://api.github.com/repos/${{ env.UPSTREAM_OWNER }}/${{ env.UPSTREAM_REPO }}"
          echo "default_branch=$(curl -s "$U" | jq -r '.default_branch')" >> $GITHUB_OUTPUT
          echo "upstream_sha=$(curl -s "$U/commits/HEAD" | jq -r '.sha')" >> $GITHUB_OUTPUT

      # --------------------------------------------------------
      # 6. 同步 fork
      # --------------------------------------------------------
      - name: Sync fork
        id: sync
        run: |
          FR="${{ steps.setup.outputs.fork_repo }}"
          BR="${{ steps.upstream-info.outputs.default_branch }}"
          T=$(mktemp -d) && cd "$T"
          git clone "https://x-access-token:${{ secrets.FORK_TOKEN }}@github.com/$FR" .
          git remote add up "https://github.com/${{ env.UPSTREAM_OWNER }}/${{ env.UPSTREAM_REPO }}.git"
          git fetch up "$BR"
          US=$(git rev-parse "up/$BR"); LS=$(git rev-parse HEAD)
          echo "upstream_sha=$US" >> $GITHUB_OUTPUT
          if [ "$US" = "$LS" ]; then
            echo "has_new_commits=false" >> $GITHUB_OUTPUT
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git merge --no-edit "up/$BR" && git push origin "$BR" && \
              echo "has_new_commits=true" >> $GITHUB_OUTPUT || { git merge --abort; exit 1; }
          fi
          cd / && rm -rf "$T"

      # --------------------------------------------------------
      # 7. 构建决策
      # --------------------------------------------------------
      - name: Build decision
        id: decision
        run: |
          S="false"
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && S="true"
          [ "${{ steps.sync.outputs.has_new_commits }}" = "true" ] && S="true"
          echo "should_build=$S" >> $GITHUB_OUTPUT

  # ================================================================
  # Job 2: Build APK
  # ================================================================
  build:
    needs: sync-upstream
    if: needs.sync-upstream.outputs.should_build == 'true'
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------------
      # 1. Clone fork 源码
      # --------------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.sync-upstream.outputs.fork_repo }}
          token: ${{ secrets.FORK_TOKEN }}
          fetch-depth: 1
          path: source

      - name: Set env
        working-directory: source
        run: |
          echo "date_today=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      # --------------------------------------------------------
      # 2. JDK 17
      # --------------------------------------------------------
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17
          cache: 'gradle'

      # --------------------------------------------------------
      # 3. Rust (for NDK libs + APK recompress)
      # --------------------------------------------------------
      - name: Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          override: true

      - run: cargo install cargo-ndk || true
      - run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      # --------------------------------------------------------
      # 4. Android SDK + NDK
      # --------------------------------------------------------
      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: NDK
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            --install "ndk;29.0.14206865" 2>/dev/null || \
          echo "y" | sdkmanager --install "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> $GITHUB_ENV

      - run: chmod +x source/gradlew

      # --------------------------------------------------------
      # 5. Cache
      # --------------------------------------------------------
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/ ~/.cargo/registry/ ~/.cargo/git/
          key: rust-${{ hashFiles('source/**/Cargo.lock') }}
          restore-keys: rust-
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/caches ~/.gradle/wrapper ~/.m2/repository
          key: gradle-${{ hashFiles('source/**/*.gradle.kts', 'source/**/gradle-wrapper.properties') }}

      # --------------------------------------------------------
      # 6. Build unsigned release APK
      #    不设 signingKey 环境变量，项目跳过签名配置，
      #    生成 unsigned APK。
      # --------------------------------------------------------
      - name: Build unsigned release APK
        working-directory: source
        run: |
          bash ./gradlew assembleFullRelease assembleLiteRelease
        env:
          CI_BUILD_MINIFY: true

      # --------------------------------------------------------
      # 7. 准备签名秘钥
      #    用 Android SDK debug keystore（apksigner 兼容所有格式）
      # --------------------------------------------------------
      - name: Prepare signing key
        id: signing
        run: |
          KS="$HOME/.android/debug.keystore"
          mkdir -p "$HOME/.android"
          if [ ! -f "$KS" ]; then
            echo "Creating debug keystore..."
            keytool -genkey -v -keystore "$KS" \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass android -keypass android \
              -dname "CN=Android Debug, O=Android, C=US" 2>/dev/null
          fi
          echo "ks=$KS" >> $GITHUB_OUTPUT

      # --------------------------------------------------------
      # 8. 用 apksigner 签名 APK
      #    apksigner 使用 Java KeyStore API，支持 JKS/PKCS12 等所有格式
      # --------------------------------------------------------
      - name: Sign APK with apksigner
        run: |
          # 定位 apksigner（在 Android SDK build-tools 中）
          APKSIGNER=$(find "$ANDROID_SDK_ROOT" -name apksigner -type f 2>/dev/null | head -1)
          if [ -z "$APKSIGNER" ]; then
            BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* 2>/dev/null | sort -V | tail -1)
            APKSIGNER="$BT/apksigner"
          fi
          if [ ! -f "$APKSIGNER" ]; then
            echo "::error::apksigner not found in Android SDK"
            exit 1
          fi
          echo "Using apksigner: $APKSIGNER"

          KS="${{ steps.signing.outputs.ks }}"
          APK_DIR="${{ github.workspace }}/source/app/build/outputs/apk"

          SIGNED=0
          for APK in $(find "$APK_DIR" -name "*release*.apk" -type f); do
            echo "Signing: $APK"
            "$APKSIGNER" sign --ks "$KS" \
              --ks-key-alias androiddebugkey \
              --ks-pass pass:android \
              --key-pass pass:android \
              "$APK" && { echo "  ✅ Signed"; SIGNED=$((SIGNED+1)); } || echo "  ❌ Failed"
          done
          echo "signed_count=$SIGNED" >> $GITHUB_OUTPUT
          if [ "$SIGNED" -eq 0 ]; then echo "::error::No APKs were signed"; exit 1; fi

      # --------------------------------------------------------
      # 9. Verify signature
      # --------------------------------------------------------
      - name: Verify APK signatures
        run: |
          APKSIGNER=$(find "$ANDROID_SDK_ROOT" -name apksigner -type f 2>/dev/null | head -1)
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* 2>/dev/null | sort -V | tail -1)
          APKSIGNER="${APKSIGNER:-$BT/apksigner}"
          for APK in $(find "${{ github.workspace }}/source/app/build/outputs/apk" -name "*release*.apk"); do
            echo "Verifying: $(basename "$APK")"
            "$APKSIGNER" verify --print-certs "$APK" | head -3
          done

      # --------------------------------------------------------
      # 10. Organize APK
      # --------------------------------------------------------
      - name: Organize APK
        run: |
          mkdir -p upload
          APK_DIR="${{ github.workspace }}/source/app/build/outputs/apk"
          for f in $(find "$APK_DIR" -name "*full*release*.apk" -type f | head -1); do
            cp "$f" upload/zhihu++-full.apk; echo "✅ full ($(du -h "$f" | cut -f1))"
          done
          for f in $(find "$APK_DIR" -name "*lite*release*.apk" -type f | head -1); do
            cp "$f" upload/zhihu++-lite.apk; echo "✅ lite ($(du -h "$f" | cut -f1))"
          done
          ls -lh upload/

      # --------------------------------------------------------
      # 11. Upload artifact (90 days)
      # --------------------------------------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zhihu++-apk-${{ env.short_sha }}-${{ github.run_attempt }}
          path: upload/
          retention-days: 90

      # --------------------------------------------------------
      # 12. Create Release
      # --------------------------------------------------------
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.short_sha }}-${{ github.run_id }}
          name: "Zhihu++ Build ${{ env.date_today }} (${{ env.short_sha }})"
          body: |
            ## 自动构建的知乎++ APK

            - 构建日期 : ${{ env.date_today }}
            - 上游 Commit : `${{ needs.sync-upstream.outputs.upstream_sha }}`
            - 签名 : ✅ debug 密钥签名，可直接安装

            | 文件 | 说明 |
            |------|------|
            | zhihu++-full.apk | Full 版 — 含 AI 功能 (ONNX) |
            | zhihu++-lite.apk | Lite 版 — 不含 AI，体积更小 |

            > 如需使用自定义签名，在仓库 Secrets 配置 ANDROID_SIGNING_KEY 等变量
          files: upload/*.apk
          fail_on_unmatched_files: false
          prerelease: true
