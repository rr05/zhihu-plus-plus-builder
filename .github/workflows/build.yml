name: Auto Build Zhihu++

on:
  workflow_dispatch:
    inputs:
      skip_sync:
        description: '跳过上游同步，直接用当前 fork 代码构建'
        required: false
        default: false
        type: boolean

  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: zhihu-plus-plus-build
  cancel-in-progress: true

permissions:
  contents: write

env:
  UPSTREAM_OWNER: zly2006
  UPSTREAM_REPO: zhihu-plus-plus
  FORK_OWNER: ""

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.decision.outputs.should_build }}
      upstream_branch: ${{ steps.upstream-info.outputs.default_branch }}
      upstream_sha: ${{ steps.upstream-info.outputs.upstream_sha }}

    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure GitHub CLI
        run: |
          echo "GH_TOKEN=${{ secrets.FORK_TOKEN }}" >> $GITHUB_ENV
          WHOAMI=$(gh api user --jq '.login')
          echo "Authenticated as: $WHOAMI"
          echo "gh_user=$WHOAMI" >> $GITHUB_ENV

      - name: Determine fork owner
        id: fork-owner
        run: |
          if [ -n "${{ env.FORK_OWNER }}" ]; then
            OWNER="${{ env.FORK_OWNER }}"
          else
            OWNER="${{ env.gh_user }}"
          fi
          echo "Fork will be under: $OWNER"
          echo "owner=$OWNER" >> $GITHUB_OUTPUT
          echo "fork_repo=$OWNER/${{ env.UPSTREAM_REPO }}" >> $GITHUB_OUTPUT

      - name: Check if fork exists
        id: check-fork
        run: |
          OWNER="${{ steps.fork-owner.outputs.owner }}"
          FORK_REPO="$OWNER/${{ env.UPSTREAM_REPO }}"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${{ secrets.FORK_TOKEN }}" \
            "https://api.github.com/repos/$FORK_REPO")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
          echo "fork_repo=$FORK_REPO" >> $GITHUB_OUTPUT

      - name: Create fork via API
        if: steps.check-fork.outputs.exists == 'false'
        run: |
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: token ${{ secrets.FORK_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ env.UPSTREAM_OWNER }}/${{ env.UPSTREAM_REPO }}/forks" \
            -d '{}')
          FULL_NAME=$(echo "$RESPONSE" | jq -r '.full_name // empty')
          if [ -n "$FULL_NAME" ]; then
            echo "✅ Fork created: $FULL_NAME"
          else
            echo "::error::$(echo "$RESPONSE" | jq -r '.message')"
            exit 1
          fi

      - name: Wait for fork readiness
        if: steps.check-fork.outputs.exists == 'false'
        run: sleep 20

      - name: Get upstream info
        id: upstream-info
        run: |
          API_URL="https://api.github.com/repos/${{ env.UPSTREAM_OWNER }}/${{ env.UPSTREAM_REPO }}"
          DEFAULT_BRANCH=$(curl -s "$API_URL" | jq -r '.default_branch')
          SHA=$(curl -s "$API_URL/git/refs/heads/$DEFAULT_BRANCH" | jq -r '.object.sha')
          echo "default_branch=$DEFAULT_BRANCH" >> $GITHUB_OUTPUT
          echo "upstream_sha=$SHA" >> $GITHUB_OUTPUT

      - name: Sync fork with upstream
        id: sync
        run: |
          OWNER="${{ steps.fork-owner.outputs.owner }}"
          FORK_REPO="$OWNER/${{ env.UPSTREAM_REPO }}"
          BRANCH="${{ steps.upstream-info.outputs.default_branch }}"

          TMPDIR=$(mktemp -d)
          cd "$TMPDIR"
          git clone "https://x-access-token:${{ secrets.FORK_TOKEN }}@github.com/$FORK_REPO" .
          git remote add upstream "https://github.com/${{ env.UPSTREAM_OWNER }}/${{ env.UPSTREAM_REPO }}.git"
          git fetch upstream "$BRANCH"

          UPSTREAM_SHA=$(git rev-parse "upstream/$BRANCH")
          LOCAL_SHA=$(git rev-parse HEAD)
          echo "upstream_sha=$UPSTREAM_SHA" >> $GITHUB_OUTPUT

          if [ "$UPSTREAM_SHA" = "$LOCAL_SHA" ]; then
            echo "has_new_commits=false" >> $GITHUB_OUTPUT
          else
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            if git merge --no-edit "upstream/$BRANCH"; then
              git push origin "$BRANCH"
              echo "has_new_commits=true" >> $GITHUB_OUTPUT
            else
              git merge --abort
              echo "has_new_commits=false" >> $GITHUB_OUTPUT
              exit 1
            fi
          fi
          cd / && rm -rf "$TMPDIR"

      - name: Decide whether to build
        id: decision
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.skip_sync }}" = "true" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
          elif [ "${{ steps.sync.outputs.has_new_commits }}" = "true" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: sync-upstream
    if: needs.sync-upstream.outputs.should_build == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork source code
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.sync-upstream.outputs.fork_repo || steps.fork-owner.outputs.fork_repo }}
          token: ${{ secrets.FORK_TOKEN }}
          fetch-depth: 1
          path: source

      - name: Set env vars
        working-directory: source
        run: |
          echo "date_today=$(date +'%Y-%m-%d')"          >> $GITHUB_ENV
          echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17
          cache: 'gradle'

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          override: true

      - name: Install cargo-ndk
        run: cargo install cargo-ndk || true

      - name: Add Android Rust targets
        run: |
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi
          rustup target add i686-linux-android
          rustup target add x86_64-linux-android

      - name: Grant gradlew permissions
        working-directory: source
        run: chmod +x ./gradlew

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            --install "ndk;29.0.14206865" 2>/dev/null \
          || echo "y" | sdkmanager --install "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> $GITHUB_ENV

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: rust-cache-${{ hashFiles('source/**/Cargo.lock', 'source/**/Cargo.toml') }}
          restore-keys: rust-cache-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository
          key: gradle-cache-${{ hashFiles('source/**/*.gradle.kts', 'source/**/gradle-wrapper.properties') }}

      - name: Run KtLint
        working-directory: source
        run: ./gradlew ktlintCheck

      - name: Build APK
        working-directory: source
        run: |
          bash ./gradlew assembleFullRelease assembleLiteRelease
        env:
          signingKey:           ${{ secrets.ANDROID_SIGNING_KEY }}
          keyAlias:             ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword:     ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword:          ${{ secrets.ANDROID_KEY_PASSWORD }}
          CI_BUILD_MINIFY:      true

      - name: Organize APK outputs
        run: |
          mkdir -p upload
          APK_DIR="${{ github.workspace }}/source/app/build/outputs/apk"
          [ -f "$APK_DIR/full/release/app-full-release.apk" ] && cp "$APK_DIR/full/release/app-full-release.apk" upload/zhihu++-full.apk
          [ -f "$APK_DIR/lite/release/app-lite-release.apk" ] && cp "$APK_DIR/lite/release/app-lite-release.apk" upload/zhihu++-lite.apk
          ls -lh upload/

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: zhihu++-apk-${{ env.short_sha }}-${{ github.run_attempt }}
          path: upload/
          retention-days: 90

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.short_sha }}-${{ github.run_id }}
          name: "Zhihu++ Build ${{ env.date_today }} (${{ env.short_sha }})"
          body: |
            ## 自动构建的知乎++ APK

            - **构建日期** : ${{ env.date_today }}
            - **上游 Commit**: `${{ needs.sync-upstream.outputs.upstream_sha || env.short_sha }}`
            - **触发方式**   : `${{ github.event_name }}`

            | 文件 | 说明 |
            |------|------|
            | `zhihu++-full.apk` | Full 版 — 含 AI 功能 (ONNX) |
            | `zhihu++-lite.apk` | Lite 版 — 不含 AI，体积更小 |

            > 如需签名 APK，请在仓库 Setting → Secrets 中配置：
            > ANDROID_SIGNING_KEY, ANDROID_KEY_ALIAS, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD
          files: |
            upload/zhihu++-full.apk
            upload/zhihu++-lite.apk
          fail_on_unmatched_files: false
          prerelease: true
